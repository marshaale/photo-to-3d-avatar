name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Start server and check health
        run: |
          REPLICATE_API_KEY=ci-placeholder PORT=8080 bun run start > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/

      - name: Install production dependencies
        if: github.event_name != 'pull_request'
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile --production

      - name: Pack the release
        if: github.event_name != 'pull_request'
        run: |
          tar --exclude='.git' --exclude='terraform' --exclude='ansible' --exclude='.github' --exclude='*.log' --exclude='*.tmp' --exclude='nginx' -czf "$RUNNER_TEMP/release.tar.gz" .
          mv "$RUNNER_TEMP/release.tar.gz" release.tar.gz
          sha256sum release.tar.gz > release.sha256

      - name: Save release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            release.tar.gz
            release.sha256
          retention-days: 7
          compression-level: 0
  deploy:
    name: Deploy to the servers
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Prepare deployment secrets
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          HOSTS_INI: ${{ secrets.HOSTS}}
        run: |
          set -euo pipefail
          test -n "$APP_ENV"
          test -n "$HOSTS_INI"
          printf '%s\n' "$APP_ENV" > "$RUNNER_TEMP/app.env"
          printf '%s\n' "$HOSTS_INI" > "$RUNNER_TEMP/hosts.ini"
          chmod 600 "$RUNNER_TEMP/app.env" "$RUNNER_TEMP/hosts.ini"

      - name: Deploy release with Ansible
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          command -v ansible-playbook
          sha256sum --check release.sha256
          playbook="$HOME/ansible/deploy-playbook.yml"
          test -f "$playbook"
          ansible-playbook \
            --inventory "$RUNNER_TEMP/hosts.ini" \
            "$playbook" \
            --extra-vars "release_id=$RELEASE_ID" \
            --extra-vars "release_archive=$GITHUB_WORKSPACE/release.tar.gz" \
            --extra-vars "app_env_file=$RUNNER_TEMP/app.env"

      - name: Remove deployment secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/app.env" "$RUNNER_TEMP/hosts.ini"
