name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Start server and check health
        run: |
          REPLICATE_API_KEY=ci-placeholder PORT=3000 bun run start > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/

      - name: Install production dependencies
        if: github.event_name != 'pull_request'
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile --production

      - name: Pack the release
        if: github.event_name != 'pull_request'
        run: |
          tar --exclude='.git' --exclude='terraform' --exclude='ansible' --exclude='.github' --exclude='*.log' --exclude='*.tmp' --exclude='nginx' -czf "$RUNNER_TEMP/release.tar.gz" .
          mv "$RUNNER_TEMP/release.tar.gz" release.tar.gz
          sha256sum release.tar.gz | cut -d ' ' -f 1 > release.sha256

      - name: Save release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            release.tar.gz
            release.sha256
          retention-days: 7
          compression-level: 0
