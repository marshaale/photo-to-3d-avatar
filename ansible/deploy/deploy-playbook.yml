---
- name: Deploy photo-to-3d-avatar release
  hosts: all
  remote_user: ubuntu
  become: true
  gather_facts: false

  vars:
    app_root: /srv/photo23davatar
    release_dir: "{{ app_root }}/releases/{{ release_id }}"
    staging_dir: "{{ app_root }}/releases/.{{ release_id }}.staging"
    app_env_path: "{{ app_root }}/env/app.env"
    app_env_backup_path: "{{ app_root }}/env/.app.env-rollback-{{ release_id }}"

  tasks:
    - name: Validate deployment inputs
      ansible.builtin.assert:
        that:
          - release_id is defined
          - release_id is match('^[0-9a-f]{40}$')
          - release_archive is defined
          - app_env_file is defined
        fail_msg: "A valid release ID, release archive, and app environment file are required."

    - name: Ensure application directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ app_root }}"
          owner: deploy
          group: deploy
          mode: "0755"
        - path: "{{ app_root }}/releases"
          owner: deploy
          group: runner
          mode: "2750"
        - path: "{{ app_root }}/env"
          owner: deploy
          group: deploy
          mode: "0700"

    - name: Check whether this release is already installed
      ansible.builtin.stat:
        path: "{{ release_dir }}"
      register: installed_release

    - name: Remove an incomplete staging directory
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: absent
      when: not installed_release.stat.exists

    - name: Create a clean staging directory
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: directory
        owner: deploy
        group: runner
        mode: "2750"
      when: not installed_release.stat.exists

    - name: Extract release archive
      ansible.builtin.unarchive:
        src: "{{ release_archive }}"
        dest: "{{ staging_dir }}"
        owner: deploy
        group: runner
        mode: "u=rwX,g=rX,o="
      when: not installed_release.stat.exists

    - name: Move the extracted release into place
      ansible.builtin.command:
        argv:
          - mv
          - -T
          - "{{ staging_dir }}"
          - "{{ release_dir }}"
      when: not installed_release.stat.exists

    - name: Ensure the installed release is readable by the service
      ansible.builtin.file:
        path: "{{ release_dir }}"
        state: directory
        owner: deploy
        group: runner
        mode: "u=rwX,g=rX,o="
        recurse: true

    - name: Check whether an environment file already exists
      ansible.builtin.stat:
        path: "{{ app_env_path }}"
      register: previous_app_env

    - name: Back up the current environment file for rollback
      ansible.builtin.copy:
        src: "{{ app_env_path }}"
        dest: "{{ app_env_backup_path }}"
        remote_src: true
        owner: deploy
        group: deploy
        mode: "0600"
      when: previous_app_env.stat.exists

    - name: Install the new application environment file
      ansible.builtin.copy:
        src: "{{ app_env_file }}"
        dest: "{{ app_env_path }}"
        owner: deploy
        group: deploy
        mode: "0600"

    - name: Record the current release link
      ansible.builtin.stat:
        path: "{{ app_root }}/current"
      register: previous_release_link

    - name: Activate the new release and verify application health
      block:
        - name: Atomically activate the release
          ansible.builtin.shell:
            cmd: |
              set -e
              ln -sfnT '{{ release_dir }}' '{{ app_root }}/.current-{{ release_id }}'
              mv -Tf '{{ app_root }}/.current-{{ release_id }}' '{{ app_root }}/current'
          args:
            executable: /bin/bash

        - name: Restart the application service
          ansible.builtin.systemd:
            name: photo23davatar.service
            state: restarted

        - name: Check application health
          remote_user: true
          ansible.builtin.uri:
            url: http://127.0.0.1:8080/
            status_code: 200
          register: health_check
          until: health_check.status == 200
          retries: 15
          delay: 2

      rescue:
        - name: Restore the previous release link
          ansible.builtin.file:
            path: "{{ app_root }}/current"
            src: "{{ previous_release_link.stat.lnk_source }}"
            state: link
            force: true
          when:
            - previous_release_link.stat.islnk | default(false)

        - name: Remove the current link when there was no previous release
          ansible.builtin.file:
            path: "{{ app_root }}/current"
            state: absent
          when: not (previous_release_link.stat.islnk | default(false))

        - name: Restore the previous environment file
          ansible.builtin.copy:
            src: "{{ app_env_backup_path }}"
            dest: "{{ app_env_path }}"
            remote_src: true
            owner: deploy
            group: deploy
            mode: "0600"
          when: previous_app_env.stat.exists

        - name: Remove the new environment file when there was no previous one
          ansible.builtin.file:
            path: "{{ app_env_path }}"
            state: absent
          when: not previous_app_env.stat.exists

        - name: Restart the application using the restored release
          ansible.builtin.systemd:
            name: photo23davatar.service
            state: restarted
          when: previous_release_link.stat.islnk | default(false)

        - name: Report deployment failure after rollback
          ansible.builtin.fail:
            msg: "Deployment failed health checks; the previous release and environment were restored."

    - name: Remove the environment rollback copy
      ansible.builtin.file:
        path: "{{ app_env_backup_path }}"
        state: absent
