# /etc/ssh/sshd_config.d/00-hardening.conf
# Our SSH rules. The name starts with "00-" so it is read first, and for
# each setting sshd keeps the FIRST value it reads.

# Log in with a key only. Never with a password, never as root.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no

# Only these users may log in over SSH.
AllowUsers ubuntu deploy

# Give attackers fewer tries and less time.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60

# Switch off features this server does not need.
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
PermitTunnel no

# Close connections that have gone silent (after about 10 minutes).
ClientAliveInterval 300
ClientAliveCountMax 2